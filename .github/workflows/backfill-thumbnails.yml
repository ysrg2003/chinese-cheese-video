name: Chinese Cheese Video — backfill standard thumbnails

on:
  workflow_dispatch:
    inputs:
      job_ids:
        description: "Comma-separated existing job IDs"
        required: true
        default: "curriculum-en-015-the-cannon-and-its-mount-en,curriculum-en-016-soldiers-before-and-after-river-en"
        type: string

permissions:
  contents: write

concurrency:
  group: chinese-cheese-video-thumbnail-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_DB_PATH: data/chinese_cheese_video.db
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      YOUTUBE_HTTP_TIMEOUT_SECONDS: "180"
      YOUTUBE_PUBLISH_MODE: public
    steps:
      - name: Checkout repository and persistent SQLite catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Validate YouTube OAuth configuration
        run: test -n "$YOUTUBE_OAUTH_TOKEN_JSON"

      - name: Upload thumbnails without re-uploading videos
        env:
          JOB_IDS: ${{ inputs.job_ids }}
        run: |
          set -euo pipefail
          IFS=',' read -ra IDS <<< "$JOB_IDS"
          ARGS=()
          for job_id in "${IDS[@]}"; do
            clean="$(echo "$job_id" | xargs)"
            test -n "$clean"
            ARGS+=(--job-id "$clean")
          done
          PYTHONPATH=python python python/backfill_thumbnails.py "${ARGS[@]}" --report thumbnail-backfill-report.json

      - name: Upload backfill report and generated thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-cheese-thumbnail-backfill-${{ github.run_id }}
          retention-days: 14
          path: |
            thumbnail-backfill-report.json
            output/thumbnail-backfill/**
            data/chinese_cheese_video.db
          if-no-files-found: warn

      - name: Commit catalog thumbnail metadata
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chinese_cheese_video.db
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore: persist standard thumbnail backfill [skip ci]"
            git push
          fi
