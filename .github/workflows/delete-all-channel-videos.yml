name: Delete all Xiangqi Lab channel videos and reset catalog

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_ALL_XIANGQI_CHANNEL_VIDEOS exactly"
        required: true
        type: string
      execute:
        description: "Perform permanent deletion; false performs a dry-run only"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: chinese-cheese-video-channel-reset
  cancel-in-progress: false

jobs:
  reset-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      LOCAL_DB_PATH: data/chinese_cheese_video.db
      CONFIRMATION: ${{ inputs.confirmation }}
      EXECUTE: ${{ inputs.execute }}
    steps:
      - name: Checkout repository and persistent SQLite catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Validate deletion confirmation and OAuth
        run: |
          test "$CONFIRMATION" = "DELETE_ALL_XIANGQI_CHANNEL_VIDEOS"
          test -n "$YOUTUBE_OAUTH_TOKEN_JSON"

      - name: Enumerate complete channel and create backup manifest
        run: |
          mkdir -p channel-reset-artifacts
          python python/delete_all_channel_videos.py \
            --confirmation "$CONFIRMATION" \
            --manifest channel-reset-artifacts/full-channel-video-audit.json \
            --report channel-reset-artifacts/deletion-report.json \
            --dry-run
          cp data/chinese_cheese_video.db channel-reset-artifacts/chinese_cheese_video.before-reset.db
          cp data/ai_router.db channel-reset-artifacts/ai_router.before-reset.db
          cp data/chinese_cheese_video.db-wal channel-reset-artifacts/chinese_cheese_video.before-reset.db-wal 2>/dev/null || true
          cp data/chinese_cheese_video.db-shm channel-reset-artifacts/chinese_cheese_video.before-reset.db-shm 2>/dev/null || true
          sha256sum channel-reset-artifacts/* > channel-reset-artifacts/SHA256SUMS.before.txt

      - name: Permanently delete every current channel video
        if: inputs.execute == true
        run: |
          python python/delete_all_channel_videos.py \
            --confirmation "$CONFIRMATION" \
            --manifest channel-reset-artifacts/full-channel-video-audit.json \
            --report channel-reset-artifacts/deletion-report.json

      - name: Refuse reset unless deletion was executed
        if: inputs.execute != true
        run: |
          echo "Dry-run completed. No videos were deleted and the catalog was not reset."
          exit 0

      - name: Verify every backed-up video is absent
        if: inputs.execute == true
        run: python python/verify_full_channel_deletion.py --manifest channel-reset-artifacts/full-channel-video-audit.json | tee channel-reset-artifacts/deletion-verification.json

      - name: Reset local catalog while preserving old identities in history
        if: inputs.execute == true
        run: |
          python python/reset_all_channel_catalog.py \
            --db-path "$LOCAL_DB_PATH" \
            --manifest channel-reset-artifacts/full-channel-video-audit.json \
            --report channel-reset-artifacts/catalog-reset-report.json
          sha256sum channel-reset-artifacts/* > channel-reset-artifacts/SHA256SUMS.after.txt

      - name: Upload deletion and reset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-channel-reset-${{ github.run_id }}
          path: channel-reset-artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Commit reset catalog and workflow evidence
        if: inputs.execute == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chinese_cheese_video.db channel-reset-artifacts/deletion-report.json channel-reset-artifacts/deletion-verification.json channel-reset-artifacts/catalog-reset-report.json
          git commit -m "Reset catalog after full channel restart [skip ci]" || echo "No reset changes to commit"
          git push origin HEAD:master
