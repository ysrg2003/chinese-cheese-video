name: Permanently delete invalid Xiangqi uploads

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_INVALID_XIANGQI_VIDEOS to authorize permanent deletion"
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-invalid-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "DELETE_INVALID_XIANGQI_VIDEOS"
          test -n "$YOUTUBE_OAUTH_TOKEN_JSON"

      - name: Preflight and permanently delete audited invalid videos
        run: python python/delete_invalid_youtube_videos.py --confirmation "$CONFIRMATION"
