name: Reference-edit visual service smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHATGPT_VISUAL_API_BASE: ${{ vars.CHATGPT_VISUAL_API_BASE || 'https://yousefsg-chatgpt-api.hf.space' }}
      CHATGPT_VISUAL_API_KEY: ${{ secrets.CHATGPT_VISUAL_API_KEY }}
      REFERENCE_EDIT_SMOKE_DIR: reference-edit-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test dependencies
        run: python -m pip install --upgrade pip && python -m pip install Pillow requests
      - name: Run authenticated reference-edit smoke test
        run: python python/reference_edit_smoke.py
      - name: Upload reference, mask, edited output, and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-edit-smoke-${{ github.run_id }}
          retention-days: 14
          path: reference-edit-smoke/**
