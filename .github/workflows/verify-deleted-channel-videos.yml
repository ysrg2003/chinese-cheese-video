name: Verify user-deleted Xiangqi videos

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VERIFY_DELETED_XIANGQI_CATALOG to run the read-only verification"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: inputs.confirmation == 'VERIFY_DELETED_XIANGQI_CATALOG'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Verify that user-deleted videos are absent
        run: python python/verify_deleted_channel_videos.py | tee deleted-channel-videos-verification.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deleted-channel-videos-verification-${{ github.run_id }}
          retention-days: 30
          path: deleted-channel-videos-verification.json
          if-no-files-found: warn
