# GitHub Actions workflow for autonomous Xiangqi production and public YouTube publishing
name: Chinese Cheese Video — autonomous production

on:
  schedule:
    # UTC: 11:15, 17:15, and 23:15 in Arabia Standard Time (UTC+3).
    # GitHub may delay scheduled starts under load; concurrency keeps runs safe.
    - cron: "15 8 * * *"
    - cron: "15 14 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      daily_count:
        description: "New content candidates to publish in this run"
        required: true
        default: "1"
        type: string
      languages:
        description: "Comma-separated languages"
        required: true
        default: "en"
        type: string
      discovery_limit:
        description: "Maximum discovery candidates to inspect"
        required: true
        default: "20"
        type: string
      reconcile_only:
        description: "Only reconcile existing public publication states; do not discover or produce new content"
        required: false
        default: false
        type: boolean
      continuation_depth:
        description: "Internal continuation counter used when a pending publication needs another workflow run"
        required: false
        default: "0"
        type: string

concurrency:
  group: chinese-cheese-video-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    # Keep runs short and observable; a retryable pending state self-dispatches a new run.
    timeout-minutes: 60
    env:
      LOCAL_DB_PATH: data/chinese_cheese_video.db
      AI_ROUTER_PATH: ai-provider-router
      AI_ROUTER_CONFIG_DIR: ai-provider-router/config
      AI_ROUTER_STATE_DB: data/ai_router.db
      AI_ROUTER_GEMINI_KEYS_JSON: ${{ secrets.AI_ROUTER_GEMINI_KEYS_JSON }}
      AI_ROUTER_HF_KEYS_JSON: ${{ secrets.AI_ROUTER_HF_KEYS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      AI_ROUTER_CHAIN: default
      AI_ROUTER_REQUIRE_KEYS: "1"
      HF_BASE_URL: https://router.huggingface.co/v1
      HF_MODELS: ${{ vars.HF_MODELS || 'openai/gpt-oss-120b:fastest' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      YOUTUBE_PUBLISH_ENABLED: ${{ vars.YOUTUBE_PUBLISH_ENABLED || '1' }}
      YOUTUBE_LOCALIZATION_ENABLED: ${{ vars.YOUTUBE_LOCALIZATION_ENABLED || '1' }}
      YOUTUBE_PUBLISH_MODE: ${{ vars.YOUTUBE_PUBLISH_MODE || 'public' }}
      YOUTUBE_AUTO_CREATE_PLAYLISTS: ${{ vars.YOUTUBE_AUTO_CREATE_PLAYLISTS || '1' }}
      DISCOVERY_RSS_QUERY: ${{ vars.DISCOVERY_RSS_QUERY || 'xiangqi OR "Chinese chess" OR 象棋' }}
      TTS_VOICE_EN: en-US-GuyNeural
      TTS_VOICE_ZH: zh-CN-YunjianNeural
      USE_WORD_CAPTIONS: "1"
      VISUAL_STORYBOARD_ENABLED: "1"
      CHATGPT_VISUAL_API_BASE: ${{ vars.CHATGPT_VISUAL_API_BASE || 'https://yousefsg-chatgpt-api.hf.space' }}
      CHATGPT_VISUAL_API_KEY: ${{ secrets.CHATGPT_VISUAL_API_KEY }}
      VISUAL_ASSET_ENABLED: ${{ vars.VISUAL_ASSET_ENABLED || '1' }}
      VISUAL_ASSET_MAX_PER_VIDEO: ${{ vars.VISUAL_ASSET_MAX_PER_VIDEO || '2' }}
      VISUAL_ASSET_TIMEOUT_SECONDS: ${{ vars.VISUAL_ASSET_TIMEOUT_SECONDS || '720' }}
      PREPUBLISH_CRITIC_REQUIRED: "1"
      PREPUBLISH_CRITIC_MAX_ITERATIONS: "2"
      # The repository default is autonomous production; set the repository variable to 1 for an emergency freeze.
      XIANGQI_PRODUCTION_FREEZE: ${{ vars.XIANGQI_PRODUCTION_FREEZE || '0' }}

    steps:
      - name: Checkout repository and persistent SQLite catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout reusable AI Router
        uses: actions/checkout@v4
        with:
          repository: ysrg2003/ai-provider-router
          token: ${{ secrets.AI_ROUTER_REPO_TOKEN }}
          path: ai-provider-router

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt && python -m pip install -e ai-provider-router

      - name: Validate AI Router key pools and ordered chain
        run: python python/validate_ai_router_runtime.py

      - name: Validate YouTube publishing configuration
        if: env.YOUTUBE_PUBLISH_ENABLED == '1'
        run: |
          test -n "$YOUTUBE_OAUTH_TOKEN_JSON" || (echo "YOUTUBE_PUBLISH_ENABLED=1 but YOUTUBE_OAUTH_TOKEN_JSON is missing" >&2; exit 1)
          case "$YOUTUBE_PUBLISH_MODE" in
            public|private|unlisted) ;;
            *) echo "Invalid YOUTUBE_PUBLISH_MODE: $YOUTUBE_PUBLISH_MODE" >&2; exit 1 ;;
          esac

      - name: Enforce autonomous preflight contracts
        if: env.XIANGQI_PRODUCTION_FREEZE != '1'
        env:
          # Unit tests must exercise deterministic fallback visuals, not the live AI planner.
          AI_ROUTER_REQUIRE_KEYS: "0"
          PREPUBLISH_CRITIC_REQUIRED: "0"
          VISUAL_ASSET_ENABLED: "0"
        run: |
          npx tsc --noEmit
          PYTHONPATH=python python -m unittest discover -s python -p 'test_*.py'
          python -m py_compile python/*.py
          test -f docs/xiangqi_visual_spec.md
          grep -q 'Pre-publish thumbnail gate failed' python/run_pipeline.py
          test -f python/visual_qa.py
          test -f python/creative_critic.py
          grep -q 'run_prepublication_review' python/run_pipeline.py
          grep -q 'creative_review' python/run_pipeline.py
          grep -q 'PREPUBLISH_CRITIC_REQUIRED' .github/workflows/render-video.yml
          grep -q 'Rendered visual QA failed' python/run_pipeline.py
          grep -q 'verify_rendered_visuals' python/run_pipeline.py
          grep -q 'Pre-publish localization gate failed' python/youtube_publisher.py
          grep -q 'validate_move_sequence' python/director.py
          grep -q 'https://www.googleapis.com/auth/youtube.force-ssl' python/youtube_publisher.py

      - name: Continuously reconcile public publications before production
        if: env.XIANGQI_PRODUCTION_FREEZE != '1'
        id: continuous_reconcile
        continue-on-error: true
        env:
          # Fast bounded cycle: 0s, 30s, 60s, then 120s. If still pending,
          # self-dispatch rather than holding a runner idle for a long period.
          RECONCILIATION_MAX_ATTEMPTS: "4"
          RECONCILIATION_INITIAL_DELAY_SECONDS: "30"
          RECONCILIATION_MAX_DELAY_SECONDS: "120"
          RECONCILIATION_MAX_RUNTIME_MINUTES: "15"
        run: python python/continuous_reconcile.py --output continuous-reconcile.json | tee continuous-reconcile.log

      - name: Classify reconciliation completion state
        if: always()
        id: reconciliation_state
        run: |
          if [ ! -f continuous-reconcile.json ]; then
            echo "state=unexpected_failure" >> "$GITHUB_OUTPUT"
          elif grep -q '"status": "complete"' continuous-reconcile.json; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          elif grep -q '"status": "retry_window_exhausted"' continuous-reconcile.json; then
            echo "state=retry_window_exhausted" >> "$GITHUB_OUTPUT"
          elif grep -q '"status": "quota_cooldown"' continuous-reconcile.json; then
            echo "state=quota_cooldown" >> "$GITHUB_OUTPUT"
          else
            echo "state=non_retryable_failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Queue another completion run when a transient retry window expires
        if: steps.reconciliation_state.outputs.state == 'retry_window_exhausted' && env.XIANGQI_PRODUCTION_FREEZE != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTINUATION_DELAY_SECONDS: "180"
          CONTINUATION_MAX_DEPTH: "36"
          CONTINUATION_DAILY_COUNT: ${{ inputs.daily_count || '1' }}
          CONTINUATION_LANGUAGES: ${{ inputs.languages || 'en' }}
          CONTINUATION_DISCOVERY_LIMIT: ${{ inputs.discovery_limit || '20' }}
          CONTINUATION_RECONCILE_ONLY: ${{ inputs.reconcile_only == true }}
        run: |
          DEPTH="${{ inputs.continuation_depth || '0' }}"
          if ! [[ "$DEPTH" =~ ^[0-9]+$ ]]; then
            echo "Invalid continuation depth: $DEPTH" >&2
            exit 1
          fi
          if [ "$DEPTH" -ge "$CONTINUATION_MAX_DEPTH" ]; then
            echo "Continuation safety cap reached at depth $DEPTH; preserving pending state for the next scheduled run." >&2
            exit 0
          fi
          NEXT_DEPTH=$((DEPTH + 1))
          echo "Waiting ${CONTINUATION_DELAY_SECONDS}s before queueing continuation ${NEXT_DEPTH}."
          sleep "$CONTINUATION_DELAY_SECONDS"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/render-video.yml/dispatches" \
            -f ref=master \
            -f "inputs[daily_count]=${CONTINUATION_DAILY_COUNT}" \
            -f "inputs[languages]=${CONTINUATION_LANGUAGES}" \
            -f "inputs[discovery_limit]=${CONTINUATION_DISCOVERY_LIMIT}" \
            -f "inputs[reconcile_only]=${CONTINUATION_RECONCILE_ONLY}" \
            -f "inputs[continuation_depth]=${NEXT_DEPTH}"

      - name: Run autonomous discovery and production until the current item completes
        if: env.XIANGQI_PRODUCTION_FREEZE != '1' && inputs.reconcile_only != true && steps.reconciliation_state.outputs.state == 'complete'
        id: autonomous_run
        continue-on-error: true
        env:
          RUN_DAILY_COUNT: ${{ inputs.daily_count }}
          RUN_LANGUAGES: ${{ inputs.languages }}
          RUN_DISCOVERY_LIMIT: ${{ inputs.discovery_limit }}
        run: |
          set +e
          COUNT="${RUN_DAILY_COUNT:-1}"
          LANGUAGES="${RUN_LANGUAGES:-en}"
          LIMIT="${RUN_DISCOVERY_LIMIT:-20}"
          FINAL_STATUS=1
          for ATTEMPT in 1 2 3 4; do
            echo "Production attempt ${ATTEMPT}/4"
            python python/automation_runner.py --daily-count "$COUNT" --languages "$LANGUAGES" --discover-limit "$LIMIT" | tee "automation-run-${ATTEMPT}.json"
            FINAL_STATUS=${PIPESTATUS[0]}
            if [ "$FINAL_STATUS" -eq 0 ]; then
              cp "automation-run-${ATTEMPT}.json" automation-run.json
              exit 0
            fi
            if [ "$ATTEMPT" -lt 4 ]; then
              echo "Production attempt failed; reconciling public state before retrying."
              python python/continuous_reconcile.py --max-attempts 3 --initial-delay-seconds 30 --max-delay-seconds 120 --max-runtime-minutes 10 --output "continuous-reconcile-retry-${ATTEMPT}.json" | tee "continuous-reconcile-retry-${ATTEMPT}.log"
              RECONCILE_STATUS=${PIPESTATUS[0]}
              if [ "$RECONCILE_STATUS" -ne 0 ]; then
                echo "Public reconciliation is still pending; the retry loop will continue without re-rendering public jobs."
              fi
            fi
          done
          exit "$FINAL_STATUS"

      - name: Export normalized YouTube catalog
        if: always()
        run: python python/export_youtube_catalog.py --output youtube-catalog.json

      - name: Upload videos, logs, and SQLite snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-cheese-video-${{ github.run_id }}
          retention-days: 14
          path: |
            automation-run.json
            automation-run-*.json
            continuous-reconcile.json
            continuous-reconcile.log
            continuous-reconcile-retry-*.json
            continuous-reconcile-retry-*.log
            youtube-catalog.json
            data/chinese_cheese_video.db
            data/ai_router.db
            output/jobs/**/job.json
            output/jobs/**/references/**
            output/jobs/**/localization/**
            output/jobs/**/prepublish_thumbnails/**
            output/jobs/**/visual_qa/**
            output/jobs/**/*.mp4
            public/generated/**/job.json
            public/generated/**/voice.mp3
            public/generated/**/assets/**
          if-no-files-found: warn

      - name: Commit SQLite catalog and workflow state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chinese_cheese_video.db data/ai_router.db
          if git diff --cached --quiet; then
            echo "No SQLite state changes to commit."
          else
            git commit -m "chore: persist autonomous content state [skip ci]"
            git push
          fi

      - name: Mark workflow failed only for hard completion errors
        if: steps.reconciliation_state.outputs.state == 'non_retryable_failure' || steps.reconciliation_state.outputs.state == 'unexpected_failure' || steps.autonomous_run.outcome == 'failure'
        run: exit 1
