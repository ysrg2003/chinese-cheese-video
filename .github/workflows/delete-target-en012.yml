name: Delete en-012 for corrected republish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_EN012_REPUBLISH to authorize deleting only 647l1xYpD6s"
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YouTube API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt
      - name: Validate explicit confirmation
        run: |
          test "$CONFIRMATION" = "DELETE_EN012_REPUBLISH"
          test -n "$YOUTUBE_OAUTH_TOKEN_JSON"
      - name: Delete and verify only en-012
        run: python python/delete_target_youtube_video.py --confirmation "$CONFIRMATION"
