name: Xiangqi quality-gate smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTS_VOICE_EN: en-US-GuyNeural
      TTS_VOICE_ZH: zh-CN-YunjianNeural
      YOUTUBE_LOCALIZATION_ENABLED: "1"
      XIANGQI_PRODUCTION_FREEZE: "1"
      PYTHONPATH: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Run deterministic rules and publishing contract tests
        run: |
          mkdir -p smoke-output
          PYTHONPATH=python python -m unittest test_xiangqi_rules test_content_selection test_localization_thumbnail test_youtube_publisher_fake_api

      - name: Generate and verify controlled thumbnails
        run: |
          mkdir -p smoke-output
          PYTHONPATH=python python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from thumbnail import generate_thumbnail_assets

          root = Path('.')
          job = json.loads((root / 'python/sample_job.json').read_text(encoding='utf-8'))
          assets = generate_thumbnail_assets(root / 'output/sample.mp4', job, root / 'smoke-output', zh_title='中国象棋：三十二个棋子的摆法')
          for key in ('english', 'zh_studio_localized'):
              path = Path(assets[key])
              with Image.open(path) as image:
                  assert image.size == (1280, 720), image.size
              assert path.stat().st_size < 2_000_000, path.stat().st_size
          Path('smoke-output/thumbnail-smoke.json').write_text(json.dumps(assets, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Verify production remains fail-closed in this smoke
        run: |
          grep -q 'XIANGQI_PRODUCTION_FREEZE' python/run_pipeline.py
          grep -q 'Xiangqi legal-move validation failed' python/director.py
          echo 'No production upload or YouTube mutation was performed by this workflow.' > smoke-output/no-publish.txt

      - name: Upload quality-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-quality-gate-${{ github.run_id }}
          retention-days: 14
          path: smoke-output/
          if-no-files-found: error
