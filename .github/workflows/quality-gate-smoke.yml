name: Xiangqi quality-gate smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTS_VOICE_EN: en-US-GuyNeural
      TTS_VOICE_ZH: zh-CN-YunjianNeural
      YOUTUBE_LOCALIZATION_ENABLED: "1"
      XIANGQI_PRODUCTION_FREEZE: "1"
      PYTHONPATH: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt

      - name: Run full deterministic and publication contract suite
        run: |
          mkdir -p smoke-output
          npx tsc --noEmit
          PYTHONPATH=python python -m unittest discover -s python -p 'test_*.py'
          python -m py_compile python/*.py
          git diff --check

      - name: Render and verify corrected board and controlled thumbnails
        run: |
          mkdir -p smoke-output
          npx remotion still src/index.tsx XiangqiComposition smoke-output/clean-board.png --props=python/sample_job.json --frame=90 --image-format=png --log=error
          npx remotion still src/index.tsx XiangqiComposition smoke-output/shorts-cover.png --props=python/shorts_cover_sample_job.json --frame=20 --image-format=png --log=error
          PYTHONPATH=python python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from thumbnail import generate_thumbnail_assets, validate_thumbnail_assets

          root = Path('.')
          job = json.loads((root / 'python/sample_job.json').read_text(encoding='utf-8'))
          board = root / 'smoke-output/clean-board.png'
          cover = root / 'smoke-output/shorts-cover.png'
          with Image.open(board) as image:
              assert image.size == (1080, 1920), image.size
              assert image.getbbox() is not None
          with Image.open(cover) as image:
              assert image.size == (1080, 1920), image.size
              assert image.getbbox() is not None
          assets = generate_thumbnail_assets(board, job, root / 'smoke-output/thumbnails', zh_title='中国象棋：三十二个棋子的摆法')
          errors = validate_thumbnail_assets(assets)
          assert not errors, errors
          Path('smoke-output/thumbnail-smoke.json').write_text(json.dumps(assets, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Verify production remains fail-closed in this smoke
        run: |
          grep -q 'XIANGQI_PRODUCTION_FREEZE' python/run_pipeline.py
          grep -q 'Xiangqi legal-move validation failed' python/director.py
          echo 'No production upload or YouTube mutation was performed by this workflow.' > smoke-output/no-publish.txt

      - name: Upload quality-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-quality-gate-${{ github.run_id }}
          retention-days: 14
          path: smoke-output/
          if-no-files-found: error
