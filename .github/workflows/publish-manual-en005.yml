name: Publish manual en-005 asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCAL_DB_PATH: data/chinese_cheese_video.db
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      YOUTUBE_PUBLISH_ENABLED: '1'
      YOUTUBE_PUBLISH_MODE: public
      YOUTUBE_LOCALIZATION_ENABLED: '1'
      YOUTUBE_AUTO_CREATE_PLAYLISTS: ${{ vars.YOUTUBE_AUTO_CREATE_PLAYLISTS || '1' }}
      TTS_VOICE_EN: en-US-GuyNeural
      TTS_VOICE_ZH: zh-CN-YunjianNeural
      AI_ROUTER_PATH: ai-provider-router
      AI_ROUTER_CONFIG_DIR: ai-provider-router/config
      AI_ROUTER_STATE_DB: data/ai_router.db
      AI_ROUTER_GEMINI_KEYS_JSON: ${{ secrets.AI_ROUTER_GEMINI_KEYS_JSON }}
      AI_ROUTER_HF_KEYS_JSON: ${{ secrets.AI_ROUTER_HF_KEYS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      AI_ROUTER_REQUIRE_KEYS: '1'
      HF_BASE_URL: https://router.huggingface.co/v1

    steps:
      - name: Checkout repository and catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout reusable AI Router
        uses: actions/checkout@v4
        with:
          repository: ysrg2003/ai-provider-router
          token: ${{ secrets.AI_ROUTER_REPO_TOKEN }}
          path: ai-provider-router

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JavaScript dependencies and Remotion browser
        run: |
          npm ci
          npx remotion browser ensure

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install -e ai-provider-router

      - name: Publish exact local en-005 asset
        run: |
          python python/publish_manual_asset.py \
            --video output/jobs/fresh-local-en-005/fresh-local-en-005.mp4 \
            --job-json comparison-en005-publish-job.json \
            --thumbnail output/jobs/fresh-local-en-005/prepublish_thumbnails/thumbnail_en.jpg \
            --db-path data/chinese_cheese_video.db | tee manual-en005-publication.json

      - name: Export catalog evidence
        if: always()
        run: python python/export_youtube_catalog.py --output manual-en005-youtube-catalog.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-en005-publication-${{ github.run_id }}
          retention-days: 14
          path: |
            manual-en005-publication.json
            manual-en005-youtube-catalog.json
            data/chinese_cheese_video.db

      - name: Persist publication state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chinese_cheese_video.db
          if git diff --cached --quiet; then
            echo 'No SQLite state changes to commit.'
          else
            git commit -m 'chore: persist en-005 public publication [skip ci]'
            git push
          fi
